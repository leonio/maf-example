[project]
name = "designpipeline"
version = "0.1.0"
description = "Multi-agent design pipeline on Microsoft Agent Framework: idea -> interview -> spec approval -> developer/tester loop -> merge request."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent Framework (Python): agents, tools, context providers and the workflow graph, plus the
    # OpenAI-compatible chat client. The `agent-framework` meta-package would also pull in some twenty
    # integrations this app does not use.
    "agent-framework-core>=1.23,<2",
    "agent-framework-openai>=1.17,<2",
    # Web: the API, server-sent events, and the built SvelteKit UI served from the same process.
    "fastapi>=0.161,<1",
    "uvicorn>=0.54,<1",
    # Jira / Confluence clients (mocked at the transport by default).
    "httpx>=0.28,<1",
    # SPEC.md / REVIEW-n.md / MERGE_REQUEST.md rendered to HTML for the UI, raw HTML off.
    "markdown-it-py>=4,<5",
    "python-dotenv>=1.1",
]

[project.scripts]
design-pipeline = "designpipeline.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.2",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["designpipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["web", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",                        # ruff format owns line length; long strings stay readable as one line
    "RUF001", "RUF002", "RUF003",  # typographic quotes and arrows in user-facing text are intended
    "SIM105",                      # contextlib.suppress is not always clearer
]
